<!-- Photos Slider -->
<section class="my-5">
    <div class="row g-0 ">
        <div class="col-12 col-md-10">
            <div>
                <owl-carousel-o [options]="mainCustomOptions">
                    <ng-template carouselSlide>
                        <img src="./assets/images/banner-4.jpeg" height="300px" class="w-100 " alt="slider-image-1">
                    </ng-template>
                    <ng-template carouselSlide>
                        <img src="./assets/images/slider-image-2.jpeg" height="300px" class="w-100"
                            alt="slider-image-2">
                    </ng-template>
                    <ng-template carouselSlide>
                        <img src="./assets/images/slider-image-3.jpeg" height="300px" class="w-100 "
                            alt="slider-image-3">
                    </ng-template>
                </owl-carousel-o>
            </div>
        </div>
        <div class="col-md-2 d-none d-lg-block">
            <img src="./assets/images/grocery-banner.png" height="150px" class="w-100" alt="slider-image-2">
            <img src="./assets/images/grocery-banner-2.jpeg" height="150px" class="w-100" alt="slider-image-3">
        </div>
    </div>
</section>

<!--Popular Categories -->
<section class="my-5">
    <div class="border-split d-flex justify-content-between">
        <h2 class="title py-3">Shop From <span class="text-main fw-bold">Popular Categories</span></h2>
    </div>
    <div class="mt-3">
        <owl-carousel-o [options]="categoriesCustomOptions">
            @for (cat of categoriesList(); track cat._id) {
            <ng-template carouselSlide>
                <div class="text-center">
                    <img [src]="cat.image" [alt]="cat.name" class="cat-img w-100 ">
                    <h3 class="fs-4 text-main mt-2">{{cat.name}}</h3>
                </div>
            </ng-template>
            }
        </owl-carousel-o>
    </div>
</section>

<!-- Products -->
<section class="my-5">
    <div class="border-split d-flex justify-content-between">
        <h2 class="title py-3">Shop From <span class="text-main fw-bold">Top Products</span></h2>
    </div>

    <input [(ngModel)]="searchWord" type="search" class="form-control w-50 mx-auto my-4" placeholder="Search">

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3 mt-1">
        @for(product of productsList() | search: searchWord; track $index){
        <div class="product-container col">
            <app-product [product]="product" />
        </div>
        }
    </div>
</section>
